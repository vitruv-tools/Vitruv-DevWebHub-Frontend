version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    # A dependency that matches several groups goes into the first one,
    # so the lockstep groups must stay above the catch-all group.
    groups:
      # Packages that must stay on matching versions always move together,
      # including major bumps.
      react:
        patterns:
          - 'react'
          - 'react-dom'
          - '@types/react'
          - '@types/react-dom'
      mui:
        patterns:
          - '@mui/*'
      vitest:
        patterns:
          - 'vitest'
          - '@vitest/*'
      eslint:
        patterns:
          - 'eslint'
          - '@eslint/*'
      # Everything else that is not a major bump lands in one PR per run.
      # Major bumps still arrive as separate PRs for individual review.
      npm-minor-patch:
        patterns:
          - '*'
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      github-actions:
        patterns:
          - '*'
