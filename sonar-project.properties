sonar.organization=vitruv-tools
sonar.projectKey=vitruv-tools_Vitruv-DevWebHub-Frontend
sonar.projectName=Vitruv-DevWebHub-Frontend

# Production code vs. tests
sonar.sources=src
sonar.exclusions=**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx,**/__tests__/**
sonar.tests=src
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx,**/__tests__/**

# Coverage (generated by `npm run test:coverage`)
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.coverage.exclusions=src/main.tsx,**/*.d.ts

# Ignore "insecure http" (S5332) for EMF namespace URIs: they are identifiers, never fetched
sonar.issue.ignore.multicriteria=e1
sonar.issue.ignore.multicriteria.e1.ruleKey=typescript:S5332
sonar.issue.ignore.multicriteria.e1.resourceKey=src/modules/model-editor/types/structured-ecore-model.ts

# Make the pipeline fail when the SonarQube quality gate fails
sonar.qualitygate.wait=true