sonar.organization=<your-organization-key>
sonar.projectKey=<your-project-key>
sonar.projectName=Vitruv-DevWebHub-Frontend

# Production code vs. tests
sonar.sources=src
sonar.exclusions=**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx,**/__tests__/**
sonar.tests=src
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx,**/__tests__/**

# Coverage (generated by `npm run test:coverage`)
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.coverage.exclusions=src/main.tsx,**/*.d.ts

# Uncomment to make the pipeline fail when the SonarQube quality gate fails
# sonar.qualitygate.wait=true